async function save(e){

  e.preventDefault();


  const fechaInicio=$("fecha").value;
  const fechaFin=$("fechaFin").value;


  if(
    fechaInicio &&
    fechaFin &&
    fechaFin<fechaInicio
  ){

    $("formMessage").textContent=
      "La fecha de fin no puede ser anterior a la fecha de inicio.";

    $("formMessage").classList.remove("hidden");

    return;

  }


  const p={
    titulo:$("titulo").value.trim(),
    fecha:fechaInicio,
    fecha_fin:fechaFin||fechaInicio,
    hora:$("hora").value.trim(),
    tipo:$("tipo").value,
    grupos:$("grupos").value.trim(),
    lugar:$("lugar").value.trim(),
    responsable:$("responsable").value.trim(),
    observaciones:$("observaciones").value.trim()
  };


  const id=$("activityId").value;


  const r=id
    ?await db
      .from("ACTIVIDADES EXTRAESCOLARES")
      .update(p)
      .eq("id",id)

    :await db
      .from("ACTIVIDADES EXTRAESCOLARES")
      .insert(p);


  if(r.error){

    $("formMessage").textContent=
      "No se ha podido guardar. Comprueba que tu cuenta es la administradora.";

    $("formMessage").classList.remove("hidden");

    console.error(r.error);

    return;
  }


  $("formMessage").textContent=
    id
      ?"Actividad actualizada."
      :"Actividad añadida.";

  $("formMessage").classList.remove("hidden");


  reset();

  await load();

  adminList();

}
